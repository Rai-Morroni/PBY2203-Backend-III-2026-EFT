spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bancoxyz_batch?createDatabaseIfNotExist=true
    username: root
    password: admin 
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  batch:
    jdbc:
      initialize-schema: always # Crea automáticamente las tablas de metadatos de Batch
    job:
      enabled: false # Deshabilita la ejecución automática de trabajos al iniciar la aplicación
server:
  port: 8080

batch:
  skip-limit: 10000
  max-rechazo-pct: 80
  intereses:
    tasa-anual:
      ahorro: 0.02
      prestamo: 0.05
      hipoteca: 0.05