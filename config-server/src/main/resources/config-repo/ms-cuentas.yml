server:
  port: 8082

spring:
  application:
    name: ms-cuentas
  datasource:
    url: jdbc:mysql://mysql-batch:3306/bancoxyz_batch?createDatabaseIfNotExist=true
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

# Configuración para Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      cuentaService:
        slidingWindowSize: 5 # Evalúa las últimas 5 llamadas
        failureRateThreshold: 50 # Si el 50% falla, abre el circuito
        waitDurationInOpenState: 10000 # Espera 10 segundos antes de intentar reconectar